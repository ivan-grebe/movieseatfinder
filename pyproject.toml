[project]
name = "movieseatfinder"
version = "0.1.0"
description = "Find movie showtimes by the seats that are actually available."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "cachetools>=7.1.0",
    "fastapi>=0.117.1",
    "geopy>=2.5.0",
    "limits>=5.8.0",
    "mcp>=2.0.0,<3.0.0",
    "pydantic>=2.13.0",
    "requests>=2.32.0",
    "resvg>=0.2.0,<0.3",
    "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
test = [
    "httpx2>=2.7.0",
]
dev = [
    "ruff==0.16.4",
    "vulture==2.16",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
line-ending = "lf"

[tool.setuptools.packages.find]
where = ["src"]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["assets/*.ttf", "assets/*.woff2", "assets/OFL.txt"]

[tool.vercel]
entrypoint = "src.backend.server:app"

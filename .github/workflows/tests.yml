name: Tests

on:
  schedule:
    - cron: "17 9 * * *"
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install linters
        run: |
          python -m pip install vulture==2.16
          npm ci
      - name: Find dead Python code
        run: python -m vulture backend/ app.py tests/test_application.py --ignore-decorators "@app.*" --min-confidence 60
      - name: Find dead frontend code
        run: npx knip --no-config-hints

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project
        run: python -m pip install -e ".[test]"
      - name: Install frontend build dependencies
        run: npm ci
      - name: Verify production frontend bundle
        run: npm run check:frontend-bundle
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run frontend tests
        run: node --test tests/frontend-utils.test.mjs

  mobile-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project
        run: python -m pip install -e "."
      - name: Install browser test dependencies
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run mobile integration tests
        run: npm run test:mobile

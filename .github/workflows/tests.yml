name: Tests

on:
  schedule:
    - cron: "17 9 * * *"
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install linters
        run: |
          python -m pip install -e ".[dev]"
          npm ci
      - name: Check Python
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Find dead Python code
        run: python -m vulture src/backend/ --ignore-decorators "@app.*,@movie_seat_mcp.*" --min-confidence 60
      - name: Lint JavaScript
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Find dead frontend code
        run: npm run lint:frontend

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install project
        run: python -m pip install -e ".[test]"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  browser-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install project
        run: python -m pip install -e "."
      - name: Install browser test dependencies
        run: npm ci && npx playwright install --with-deps chromium
      - name: Verify production frontend bundle
        run: npm run check:frontend-bundle
      - name: Run frontend tests
        run: npm run test:frontend
      - name: Run browser integration tests
        run: npm run test:browser
